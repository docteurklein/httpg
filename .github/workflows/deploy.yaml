name: "deploy"
on:
  push:
jobs:
  test:
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: 'deploy stateless sql'
        run: |
          psql "$PG_DEV_URI" -v ON_ERROR_STOP=1 --single-transaction -c 'drop schema if exists cpres cascade' -f sql/cpres.sql
        env:
          PG_DEV_URI: ${{ secrets.PG_DEV_URI }}

      - name: 'grant person to neondb_owner'
        run: |
          psql "$PG_DEV_URI" -v ON_ERROR_STOP=1 -c 'grant person to neondb_owner'
        env:
          PG_DEV_URI: ${{ secrets.PG_DEV_URI }}
      - name: 'test sql'
        run: |
          psql "$PG_DEV_URI" -v ON_ERROR_STOP=1 $(find tests/sql -name '*.sql' -printf ' -f %h/%f\n' | sort -V | xargs)
        env:
          PG_DEV_URI: ${{ secrets.PG_DEV_URI }}

      # - name: 'test httpg'
      #   run: |
      #     nix develop .
      #     nix run .#up
      #     nix --accept-flake-config build .#httpg-test

  deploy:
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA }}'
          project_id: 'gieze-421708'
      - uses: 'google-github-actions/setup-gcloud@v3'
        with:
          project_id: 'gieze-421708'
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - run: |
          sudo rm /etc/containers/registries.conf
      - run: |
          nix run nixpkgs#skopeo -- login docker.io -u docteurklein -p "$DOCKER_PASSWORD"
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - run: nix run .#httpg-oci.copyToRegistry
      - run: nix run .#httpg-nginx-oci.copyToRegistry
          
      # - id: 'deploy'
      #   run: |
      #     gcloud run --project gieze-421708 services --region europe-west1 \
      #     update httpg \
      #       --container httpg --image "docker.io/$(nix eval .#httpg-oci.imageRefUnsafe --raw)" \
      #       --container httpg-nginx --image "docker.io/$(nix eval .#httpg-nginx-oci.imageRefUnsafe --raw)"

      - id: 'deploy'
        run 'nix run .#deploy'
        # run: |
        #   gcloud run --project gieze-421708 services --region europe-west1 \
        #   replace "$(nix build --no-link --print-out-paths .#gcloud.run.service.httpg)"
  
  migrate:
    needs: [test]
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 'migrate'
        run: |
          psql "$PG_URI" -v ON_ERROR_STOP=1 $(find migration/cpres -name '*.sql' -printf ' -f %h/%f\n' | sort -V | xargs)
        env:
          PG_URI: ${{ secrets.PG_URI }}
      - name: 'deploy stateless sql'
        run: |
          psql "$PG_URI" --single-transaction -f sql/url.sql -f sql/proc.sql -f sql/view.sql -f sql/translation.sql
        env:
          PG_URI: ${{ secrets.PG_URI }}

