name: "deploy"
on:
  push:
jobs:
  test:
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: 'migrate dev'
        run: |
          nix run .#pgmt -- migrate apply --target-url "$PG_DEV_URI"
        env:
          PG_DEV_URI: ${{ secrets.PG_DEV_URI }}

      # - name: 'grant person to neondb_owner'
      #   run: |
      #     psql "$PG_DEV_URI" -v ON_ERROR_STOP=1 -c 'grant person to neondb_owner'
      #   env:
      #     PG_DEV_URI: ${{ secrets.PG_DEV_URI }}
      - name: 'test sql'
        run: |
          psql "$PG_DEV_URI" -v ON_ERROR_STOP=1 $(find tests/sql -name '*.sql' -printf ' -f %h/%f\n' | sort -V | xargs)
        env:
          PG_DEV_URI: ${{ secrets.PG_DEV_URI }}

      # - name: 'test httpg'
      #   run: |
      #     nix develop .
      #     nix run .#up
      #     nix build .#httpg-test

  deploy:
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA }}'
          project_id: 'gieze-421708'
      - uses: 'google-github-actions/setup-gcloud@v3'
        with:
          project_id: 'gieze-421708'
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - run: |
          sudo rm /etc/containers/registries.conf
      - run: |
          nix run nixpkgs#skopeo -- login docker.io -u docteurklein -p "$DOCKER_PASSWORD"
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - id: 'deploy'
        run: 'nix run .#deploy'
  
  migrate:
    needs: [test]
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 'migrate prod'
        run: |
          nix run .#pgmt -- migrate apply --target-url "$PG_URI"

