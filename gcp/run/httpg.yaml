apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: httpg
  labels:
    cloud.googleapis.com/location: europe-west1
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/invoker-iam-disabled: 'true'
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/container-dependencies: "{nginx: [httpg]}"
    spec:
      containers:
      - env:
        - name: HTTPG_ANON_ROLE
          value: anon
        - name: HTTPG_INDEX_SQL
          value: table cpres.head union all table cpres."findings"
        - name: HTTPG_LOGIN_QUERY
          value: select public.login($1)
        - name: HTTPG_SMTP_USER
          value: sideral.underground@gmail.com
        - name: PG_CHANNELBINDING
          value: require
        - name: HTTPG_PG_DBNAME
          value: neondb
        - name: HTTPG_PG_PASSWORD_FILE
          value: /secrets/pg_password/pg_password
        - name: HTTPG_PG_READ_HOST
          value: ep-divine-unit-as9eonvl-pooler.c-4.eu-central-1.aws.neon.tech
        - name: HTTPG_PG_SSLMODE
          value: require
        - name: HTTPG_PG_USER
          value: httpg
        - name: HTTPG_PG_WRITE_HOST
          value: ep-withered-thunder-as96ubou-pooler.c-4.eu-central-1.aws.neon.tech
        - name: RUST_LOG
          value: tokio_postgres=debug,httpg=debug
        - name: HTTPG_PRIVATE_KEY_FILE
          value: /secrets/private-key-file
        - name: HTTPG_SMTP_PASSWORD_FILE
          value: /secrets/smtp_password/smtp_password
        - name: HTTPG_SMTP_RELAY
          value: smtp://smtp.gmail.com?tls=required
        - name: HTTPG_SMTP_SENDER
          value: sideral.underground@gmail.com
        - name: HTTPG_WEBPUSH_PRIVATE_KEY_FILE
          value: /secrets/webpush.pem/webpush-pem
        - name: PG_HOST
          value: ep-divine-unit-as9eonvl.c-4.eu-central-1.aws.neon.tech
        image: docker.io/docteurklein/httpg:1wrimxmflhqwlhk7hyz891nvm463g327
        name: httpg
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
        startupProbe:
          failureThreshold: 1
          periodSeconds: 240
          tcpSocket:
            port: 3000
          timeoutSeconds: 240
        volumeMounts:
        - mountPath: /secrets
          name: secret-volume
        - mountPath: /secrets/webpush.pem
          name: secret-1
        - mountPath: /secrets/pg_password
          name: secret-2
        - mountPath: /secrets/smtp_password
          name: secret-3

      - image: docker.io/docteurklein/httpg-nginx@sha256:b506eeaa431d78305f8f755bec9aac313439b67fdef4770c5bd3e8e234b2146b
        name: nginx
        ports:
          - name: http1
            containerPort: 8080
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
        startupProbe:
          timeoutSeconds: 240
          periodSeconds: 240
          failureThreshold: 1
          tcpSocket:
            port: 8080
        volumeMounts:
        - mountPath: /nginx-cache
          name: gcs
      timeoutSeconds: 30
      volumes:
      - name: gcs
        csi:
          driver: gcsfuse.run.googleapis.com
          readOnly: false
          volumeAttributes:
            bucketName: httpg-nginx
            mountOptions: uid=101,gid=101
      - name: secret-volume
        secret:
          defaultMode: 292
          items:
          - key: '1'
            path: private-key-file
          secretName: secret-1
      - name: secret-1
        secret:
          items:
          - key: latest
            path: webpush-pem
          secretName: webpush-pem
      - name: secret-2
        secret:
          items:
          - key: latest
            path: pg_password
          secretName: pg_password
      - name: secret-3
        secret:
          items:
          - key: latest
            path: smtp_password
          secretName: smtp_password
